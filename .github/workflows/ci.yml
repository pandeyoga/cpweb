name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      # CI=true: peringatan ESLint = error → build harus lulus TANPA DISABLE_ESLINT_PLUGIN.
      - run: yarn build
        env:
          CI: "true"
          REACT_APP_BACKEND_URL: "https://example.invalid"

  backend:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff && ruff check backend --select F,E9
      - run: pip install -r backend/requirements.txt --extra-index-url https://d33sy5i8bnduwe.cloudfront.net/simple/
      - run: python scripts/validate_compliance.py
      - run: python scripts/guardrails/verify_stock_locks.py
      - name: Unit test (tanpa server)
        run: cd backend && python -m pytest tests/test_ledger_e19.py -k "unit" -n 0 -q
        env:
          MONGO_URL: mongodb://localhost:27017
          DB_NAME: ci_test
          PAYMENT_DEADLINE_HOURS: "24"
